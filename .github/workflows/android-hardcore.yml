name: Build PvZ Hardcore Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build PvZ Hardcore Android (arm64-v8a)
    runs-on: ubuntu-latest

    env:
      ANDROID_API: "24"
      ANDROID_NDK_VERSION: "27.0.12077973"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Extract the project ZIP that is stored in the repository.
      - name: Extract Hardcore source
        shell: bash
        run: |
          set -e

          test -f "PvZ-Hardcore-GitHub-Ready.zip"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "PvZ-Hardcore-GitHub-Ready.zip" -d extracted

          if [ -d "extracted/PvZ-Hardcore" ]; then
            cp -a extracted/PvZ-Hardcore/. .
          else
            echo "ERROR: PvZ-Hardcore directory was not found in ZIP."
            find extracted -maxdepth 3 -type d -print
            exit 1
          fi

          echo "===== PROJECT ROOT ====="
          ls -la

          echo "===== CHECKING PROJECT ====="
          test -d android
          test -d src
          test -f CMakeLists.txt
          test -f vcpkg.json

          echo "Project looks valid."

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install host build tools
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ninja-build \
            pkg-config \
            unzip \
            curl \
            git

      # ------------------------------------------------------------
      # vcpkg
      #
      # We intentionally do NOT use lukka/run-vcpkg.
      # That action was failing because the manifest does not contain
      # a builtin-baseline.
      # ------------------------------------------------------------
      - name: Download and bootstrap vcpkg
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/vcpkg"

          git clone \
            --depth 1 \
            https://github.com/microsoft/vcpkg.git \
            "$GITHUB_WORKSPACE/vcpkg"

          "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_PATH"

          echo "===== VCPKG VERSION ====="
          "$GITHUB_WORKSPACE/vcpkg/vcpkg" version

      - name: Configure Android vcpkg environment
        shell: bash
        run: |
          set -e

          echo "VCPKG_DEFAULT_TRIPLET=arm64-android" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_HOST_TRIPLET=x64-linux" >> "$GITHUB_ENV"

          echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >> "$GITHUB_ENV"

      - name: Install PvZ native dependencies
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          "$VCPKG_ROOT/vcpkg" install \
            --triplet arm64-android \
            --host-triplet x64-linux

      - name: Show installed vcpkg libraries
        shell: bash
        run: |
          set -e

          echo "===== VCPKG INSTALLED ====="

          find "$GITHUB_WORKSPACE/vcpkg_installed" \
            -maxdepth 4 \
            -type f \
            \( -name "*.so" -o -name "*.a" \) \
            | sort \
            | head -200 || true

      # ------------------------------------------------------------
      # SDL2
      # ------------------------------------------------------------
      - name: Download SDL2
        shell: bash
        run: |
          set -e

          mkdir -p external

          SDL2_VERSION="2.32.10"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            -o "SDL2-${SDL2_VERSION}.tar.gz" \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"

          tar -xzf "SDL2-${SDL2_VERSION}.tar.gz"

          rm -rf external/SDL
          mv "SDL2-${SDL2_VERSION}" external/SDL

      - name: Build SDL2 shared library
        shell: bash
        run: |
          set -e

          cmake \
            -S external/SDL \
            -B build-sdl2 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_TEST=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl2-android"

          cmake \
            --build build-sdl2 \
            --parallel

          cmake \
            --install build-sdl2

      # ------------------------------------------------------------
      # PvZ native CMake build
      # ------------------------------------------------------------
      - name: Configure PvZ Hardcore
        shell: bash
        run: |
          set -e

          ABI="arm64-v8a"
          BUILD_DIR="build-android-${ABI}"

          rm -rf "$BUILD_DIR"

          cmake \
            -S . \
            -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_HOST_TRIPLET=x64-linux \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_CMAKE_SYSTEM_VERSION="$ANDROID_API" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DSDL2_DIR="$GITHUB_WORKSPACE/sdl2-android/lib/cmake/SDL2"

      - name: Build PvZ Hardcore native library
        shell: bash
        run: |
          set -e

          cmake \
            --build build-android-arm64-v8a \
            --parallel

      # ------------------------------------------------------------
      # Copy .so files into Android project
      # ------------------------------------------------------------
      - name: Prepare JNI libraries
        shell: bash
        run: |
          set -e

          ABI="arm64-v8a"
          JNI_DIR="android/app/src/main/jniLibs/${ABI}"

          mkdir -p "$JNI_DIR"

          echo "===== MAIN LIBRARY ====="

          MAIN_LIB="build-android-arm64-v8a/libmain.so"

          if [ ! -f "$MAIN_LIB" ]; then
            echo "ERROR: libmain.so was not produced."
            find build-android-arm64-v8a \
              -type f \
              -name "*.so" \
              -print
            exit 1
          fi

          cp -L "$MAIN_LIB" "$JNI_DIR/"

          echo "===== SDL2 LIBRARIES ====="

          find "$GITHUB_WORKSPACE/sdl2-android" \
            -type f \
            -name "libSDL2*.so" \
            -exec cp -L {} "$JNI_DIR/" \;

          echo "===== VCPKG LIBRARIES ====="

          VCPKG_LIB_DIR="$GITHUB_WORKSPACE/vcpkg_installed/arm64-android/lib"

          if [ -d "$VCPKG_LIB_DIR" ]; then
            find "$VCPKG_LIB_DIR" \
              -maxdepth 1 \
              -type f \
              -name "*.so" \
              -exec cp -L {} "$JNI_DIR/" \;
          fi

          echo "===== JNI DIRECTORY ====="
          ls -lah "$JNI_DIR"

      # ------------------------------------------------------------
      # Android Gradle build
      # ------------------------------------------------------------
      - name: Configure Android SDK path
        shell: bash
        run: |
          set -e

          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

          cat android/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          set -e

          gradle wrapper \
            --gradle-version 8.12

          chmod +x gradlew

          ./gradlew assembleRelease \
            -PusePrebuiltLibs=true \
            --no-daemon \
            --stacktrace

      # ------------------------------------------------------------
      # Collect APK
      # ------------------------------------------------------------
      - name: Find and collect APK
        shell: bash
        run: |
          set -e

          mkdir -p dist

          echo "===== APK FILES ====="

          find android \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find android \
            -type f \
            -name "*.apk" \
            -path "*/release/*" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No release APK was produced."
            exit 1
          fi

          cp "$APK" \
            "dist/pvz-hardcore-android-arm64-v8a.apk"

          echo "===== FINAL APK ====="
          ls -lh \
            "dist/pvz-hardcore-android-arm64-v8a.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvz-hardcore-android-arm64-v8a
          path: dist/pvz-hardcore-android-arm64-v8a.apk
          if-no-files-found: error
