name: Build PvZ Hardcore Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: pvz-hardcore-android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_COMPILE_API: "36"
  ANDROID_NATIVE_API: "35"
  ANDROID_NDK_VERSION: "27.0.12077973"
  CMAKE_VERSION: "3.22.1"
  BUILD_TOOLS_VERSION: "36.0.0"
  SDL2_VERSION: "2.32.10"
  GRADLE_VERSION: "8.12"

jobs:
  build-android:
    name: Build Hardcore APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Hardcore source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="PvZ-Hardcore-GitHub-Ready.zip"
          test -f "$ZIP_FILE"
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          # The release ZIP may have either a flat root or one wrapper directory.
          # Find the first directory that contains the actual PvZ project.
          SOURCE_ROOT=""
          if [ -f extracted/CMakeLists.txt ] && [ -d extracted/src ] && [ -d extracted/android ]; then
            SOURCE_ROOT="extracted"
          else
            while IFS= read -r -d '' candidate; do
              if [ -f "$candidate/CMakeLists.txt" ] && [ -d "$candidate/src" ] && [ -d "$candidate/android" ]; then
                SOURCE_ROOT="$candidate"
                break
              fi
            done < <(find extracted -type f -name CMakeLists.txt -print0 | xargs -0 -r -n1 dirname | tr '\n' '\0')
          fi

          if [ -z "$SOURCE_ROOT" ]; then
            echo "Could not locate PvZ project root."
            echo "ZIP contents:"
            find extracted -maxdepth 3 -print | sort
            exit 1
          fi

          echo "Using source root: $SOURCE_ROOT"

          # Copy source without relying on a PvZ-Hardcore wrapper directory.
          cp -a "$SOURCE_ROOT"/. "$GITHUB_WORKSPACE"/

          echo "Project root after extraction:"
          test -f "$GITHUB_WORKSPACE/CMakeLists.txt"
          test -d "$GITHUB_WORKSPACE/src"
          test -d "$GITHUB_WORKSPACE/android"
          test -f "$GITHUB_WORKSPACE/vcpkg.json"
          echo "PvZ source extraction OK."

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Manual Android SDK setup — avoids obsolete "tools" package.
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-$GITHUB_WORKSPACE/android-sdk}"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL --retry 5 -o cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-${ANDROID_COMPILE_API}" \
            "platforms;android-${ANDROID_NATIVE_API}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "cmake;${CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_CMAKE=$ANDROID_HOME/cmake/${CMAKE_VERSION}" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          test -d "$ANDROID_HOME/cmake/${CMAKE_VERSION}"

      - name: Install host tools
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config unzip curl git

      - name: Download SDL2
        shell: bash
        run: |
          set -e
          rm -rf sdl2-src
          curl -L --fail --retry 5 --retry-delay 3 \
            -o SDL2.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
          tar -xzf SDL2.tar.gz
          mv "SDL2-${SDL2_VERSION}" sdl2-src
          test -d sdl2-src/android-project/app/src/main/java
          rm -rf sdl2-src/android-project/gradle
          rm -f sdl2-src/android-project/gradlew sdl2-src/android-project/gradlew.bat

      - name: Set up vcpkg
        shell: bash
        run: |
          set -e
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$GITHUB_WORKSPACE/vcpkg"
          "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_PATH"

      - name: Install native dependencies
        shell: bash
        run: |
          set -e
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-android

      - name: Build SDL2
        shell: bash
        run: |
          set -e
          rm -rf build-sdl2 sdl2-android
          "$ANDROID_CMAKE/bin/cmake" \
            -S sdl2-src \
            -B build-sdl2 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_NATIVE_API}" \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_TEST=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl2-android"
          "$ANDROID_CMAKE/bin/cmake" --build build-sdl2 --parallel
          "$ANDROID_CMAKE/bin/cmake" --install build-sdl2
          test -f "$GITHUB_WORKSPACE/sdl2-android/lib/cmake/SDL2/SDL2Config.cmake"

      - name: Configure PvZ
        shell: bash
        run: |
          set -e
          rm -rf build-android-arm64-v8a
          "$ANDROID_CMAKE/bin/cmake" \
            -S . \
            -B build-android-arm64-v8a \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_NATIVE_API}" \
            -DSDL2_DIR="$GITHUB_WORKSPACE/sdl2-android/lib/cmake/SDL2"

      - name: Build PvZ
        shell: bash
        run: |
          set -e
          "$ANDROID_CMAKE/bin/cmake" --build build-android-arm64-v8a --parallel
          test -f build-android-arm64-v8a/libmain.so

      - name: Prepare libraries
        shell: bash
        run: |
          set -e
          JNI_DIR="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          rm -rf "$JNI_DIR"
          mkdir -p "$JNI_DIR"
          cp -L build-android-arm64-v8a/libmain.so "$JNI_DIR/libmain.so"
          find "$GITHUB_WORKSPACE/sdl2-android" -type f -name "libSDL2*.so" -exec cp -L {} "$JNI_DIR/" \;
          VCPKG_LIB="$GITHUB_WORKSPACE/vcpkg_installed/arm64-android/lib"
          if [ -d "$VCPKG_LIB" ]; then
            find "$VCPKG_LIB" -maxdepth 1 -type f -name "*.so" -exec cp -L {} "$JNI_DIR/" \;
          fi
          test -f "$JNI_DIR/libmain.so"

      - name: Configure Android project
        shell: bash
        run: |
          set -e
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f sdl2-src/android-project/app/src/main/java/org/libsdl/app/SDLActivity.java

      - name: Install Gradle
        shell: bash
        run: |
          set -e
          curl -L --fail --retry 5 --retry-delay 3 \
            -o "$RUNNER_TEMP/gradle.zip" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin/gradle" --version

      - name: Build APK
        working-directory: android
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: |
          set -e
          gradle wrapper --gradle-version "${GRADLE_VERSION}"
          chmod +x gradlew
          ./gradlew assembleRelease -PusePrebuiltLibs=true --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -e
          mkdir -p dist
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/pvz-hardcore-android-arm64-v8a.apk
          ls -lh dist/pvz-hardcore-android-arm64-v8a.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pvz-hardcore-android-arm64-v8a
          path: dist/pvz-hardcore-android-arm64-v8a.apk
          if-no-files-found: error
