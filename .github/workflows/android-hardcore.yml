name: Build PvZ Hardcore Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      ANDROID_API: "24"
      ANDROID_NDK_VERSION: "27.0.12077973"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Hardcore ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="PvZ-Hardcore-GitHub-Ready.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."
            echo "Files in repository:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          rm -rf extracted

          unzip -q "$ZIP_FILE" -d extracted

          if [ -d "extracted/PvZ-Hardcore" ]; then
            cp -a extracted/PvZ-Hardcore/. .
          else
            echo "ERROR: PvZ-Hardcore folder was not found inside ZIP."
            find extracted -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          echo "===== PROJECT CHECK ====="
          test -d android
          test -d src
          test -f CMakeLists.txt
          test -f vcpkg.json

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install host tools
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            pkg-config \
            unzip \
            curl \
            git

      - name: Set up vcpkg
        shell: bash
        run: |
          set -e

          git clone --depth 1 \
            https://github.com/microsoft/vcpkg.git \
            "$GITHUB_WORKSPACE/vcpkg"

          "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_PATH"

      - name: Install native dependencies
        shell: bash
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          "$VCPKG_ROOT/vcpkg" install \
            --triplet arm64-android

      - name: Download SDL2
        shell: bash
        run: |
          set -e

          SDL2_VERSION="2.32.10"

          mkdir -p external

          curl -L --fail --retry 5 --retry-delay 3 \
            -o "SDL2-${SDL2_VERSION}.tar.gz" \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"

          tar -xzf "SDL2-${SDL2_VERSION}.tar.gz"

          rm -rf external/SDL
          mv "SDL2-${SDL2_VERSION}" external/SDL

      - name: Build SDL2
        shell: bash
        run: |
          set -e

          cmake \
            -S external/SDL \
            -B build-sdl2 \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_TEST=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl2-android"

          cmake --build build-sdl2 --parallel
          cmake --install build-sdl2

      - name: Configure PvZ
        shell: bash
        run: |
          set -e

          rm -rf build-android-arm64-v8a

          cmake \
            -S . \
            -B build-android-arm64-v8a \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DSDL2_DIR="$GITHUB_WORKSPACE/sdl2-android/lib/cmake/SDL2"

      - name: Build PvZ
        shell: bash
        run: |
          set -e

          cmake \
            --build build-android-arm64-v8a \
            --parallel

      - name: Prepare libraries
        shell: bash
        run: |
          set -e

          ABI="arm64-v8a"
          JNI_DIR="android/app/src/main/jniLibs/$ABI"

          mkdir -p "$JNI_DIR"

          MAIN_LIB="build-android-arm64-v8a/libmain.so"

          if [ ! -f "$MAIN_LIB" ]; then
            echo "ERROR: libmain.so not found."
            find build-android-arm64-v8a -type f -name "*.so" -print
            exit 1
          fi

          cp -L "$MAIN_LIB" "$JNI_DIR/"

          find "$GITHUB_WORKSPACE/sdl2-android" \
            -type f \
            -name "libSDL2*.so" \
            -exec cp -L {} "$JNI_DIR/" \;

          VCPKG_LIB="$GITHUB_WORKSPACE/vcpkg_installed/arm64-android/lib"

          if [ -d "$VCPKG_LIB" ]; then
            find "$VCPKG_LIB" \
              -maxdepth 1 \
              -type f \
              -name "*.so" \
              -exec cp -L {} "$JNI_DIR/" \;
          fi

          echo "===== JNI FILES ====="
          ls -lah "$JNI_DIR"

      - name: Configure Gradle
        shell: bash
        run: |
          set -e

          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          set -e

          gradle wrapper --gradle-version 8.12
          chmod +x gradlew

          ./gradlew assembleRelease \
            -PusePrebuiltLibs=true \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -e

          mkdir -p dist

          APK="$(find android \
            -type f \
            -name "*.apk" \
            -path "*/release/*" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not created."
            find android -type f -name "*.apk" -print
            exit 1
          fi

          cp "$APK" \
            "dist/pvz-hardcore-android-arm64-v8a.apk"

          ls -lh \
            "dist/pvz-hardcore-android-arm64-v8a.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pvz-hardcore-android-arm64-v8a
          path: dist/pvz-hardcore-android-arm64-v8a.apk
          if-no-files-found: error
